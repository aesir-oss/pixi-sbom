name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces the run; every commit on main gets a complete one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request touched, and so which jobs it needs (#90). On main every job runs, whatever
  # changed. A filter that names .github/workflows/ci.yml runs its jobs whenever this file changes.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
      completion: ${{ steps.filter.outputs.completion }}
      action: ${{ steps.filter.outputs.action }}
      test-os: ${{ steps.os.outputs.list }}
      binaries: ${{ steps.bins.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "pixi.toml"
              - "pixi.lock"
              - "rustfmt.toml"
              - ".github/workflows/ci.yml"
            # What the tests read besides code: the pages they run as written, the examples, the release
            # workflows they check. A change here runs the tests on Linux.
            read-by-tests:
              - "docs/**"
              - "examples/**"
              - "README.md"
              - "mkdocs.yml"
              - "crates/*/mkdocs.yml"
              - "extensions.json"
              - "actions/pixi-sbom/action.yml"
              - ".github/workflows/release.yml"
              - ".github/workflows/release-artifacts.yml"
              - "scripts/whats_new.py"
            docs:
              - "docs/**"
              - "crates/*/docs/**"
              - "mkdocs.yml"
              - "crates/*/mkdocs.yml"
              - "mkdocs_hooks.py"
              - "extensions.json"
              - "CHANGELOG.md"
              - "crates/*/CHANGELOG.md"
              - "SECURITY.md"
              - ".github/workflows/ci.yml"
            deps:
              - "Cargo.lock"
              - "**/Cargo.toml"
              - "deny.toml"
              - ".github/workflows/ci.yml"
            completion:
              - "crates/pixi-sbom/src/cli.rs"
              - "crates/pixi-sbom/src/main.rs"
              - "Cargo.lock"
              - "crates/pixi-sbom/docs/completion/**"
              - "scripts/completion_e2e.py"
              - ".github/workflows/ci.yml"
            action:
              - "actions/**"
              - "crates/pixi-sbom/src/cli.rs"
              - "crates/pixi-sbom/src/main.rs"
              - ".github/workflows/ci.yml"
      # On a pull request every OS runs the tests only for code; the files the tests read run them on Linux.
      - name: Which operating systems test
        id: os
        env:
          ALL: '["ubuntu-latest","macos-latest","windows-latest"]'
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          READ: ${{ steps.filter.outputs.read-by-tests }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$CODE" = "true" ]; then
            echo "list=$ALL" >> "$GITHUB_OUTPUT"
          elif [ "$READ" = "true" ]; then
            echo 'list=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=[]' >> "$GITHUB_OUTPUT"
          fi
      # Every binary the workspace builds (one per extension), for the Build matrix: a new extension joins it without
      # an edit here. --no-deps reads the manifests only; the runner's preinstalled cargo is enough.
      - name: Which binaries the workspace builds
        id: bins
        run: |
          list=$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[.packages[].targets[] | select(.kind | index("bin")) | .name] | sort')
          [ "$list" != "[]" ] || { echo "::error::cargo metadata lists no binaries"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --check
          pixi run lint
          pixi run check
      - name: actionlint
        run: pixi run actionlint

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.test-os != '[]' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test-os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # One debug build per OS, shared by the jobs that compile it: separate copies outgrow the 10 GB.
          shared-key: debug
      - name: Unit + integration tests
        run: pixi run test

  coverage:
    name: Coverage gate
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  # What we carry ourselves. A tool that reports other people's vulnerable dependencies has no
  # business not checking its own, and a per-pull-request run cannot see an advisory published
  # after a merge — supply-chain.yml runs the same check weekly for that.
  deny:
    name: Dependency advisories and licenses
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lint
          cache: true
      - name: cargo deny
        run: pixi run -e lint deny

  # The MSRV is a promise, and an untested promise is a wrong one waiting to happen: every
  # other job builds on whatever rustc the default environment pins, which is far newer.
  msrv:
    name: Builds on the MSRV
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: msrv
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the oldest supported toolchain
        run: pixi run -e msrv msrv-check

  # The benchmarks are run for one iteration each, not timed: a shared runner's numbers say
  # more about the runner than about the code, but a benchmark that no longer compiles or
  # panics on its inputs is a real break and this catches it.
  bench:
    name: Benchmarks compile and run
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # One debug build per OS, shared by the jobs that compile it: separate copies outgrow the 10 GB.
          shared-key: debug
      - name: Every benchmark runs once (debug, test mode)
        run: pixi run bench-test

  # The Python maintenance and release scripts' own tests: no compiling, so every pull request runs them.
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      # Which release `@v0`, `@v0.12.0` or a branch installs; a wrong answer ships every user the wrong binary.
      - name: The action's version resolution
        run: pixi run action-test
      # The performance gate decides whether a build fails, so what it does with a given pair
      # of numbers is checked here rather than discovered on a red run.
      - name: The performance gate's own tests
        run: pixi run perf-test
      # A release refuses to tag without What's new notes and moves them into the release commit;
      # a mistake here either blocks every release or ships one with the wrong heading.
      - name: The What's new release step's own tests
        run: pixi run whats-new-test
      # Which repository release is made, and that its tag stays invisible to everything reading extension tags.
      - name: The repository release planner's own tests
        run: pixi run repo-release-test
      # Where each site lands on gh-pages; a mistake here deletes published versions or the old layout's links.
      - name: The Pages layout's own tests
        run: pixi run pages-test
      # Which commits each extension's changelog and release notes list; a mistake puts one extension's
      # work in another's notes, or drops a shared crate's change from the extensions built on it.
      - name: The per-extension changelog's own tests
        run: pixi run changelog-test
      - name: The Grype comparison's own tests
        run: pixi run grype-compare-test
      - name: The CPE table upkeep's own tests
        run: pixi run cpe-upkeep-test
      - name: The bundled-library signature check's own tests
        run: pixi run signature-check-test
      - name: The CRAN table generator's own tests
        run: pixi run cran-table-test
      # Only the standard library, so the default environment runs them without the examples' tools.
      - name: The example generator's own tests
        run: pixi run python -m unittest discover -s scripts -p 'test_examples.py' -v

  # Tab completion as people get it: pixi-sbom's registration and the documented `pixi sbom`
  # snippets loaded into real fish, bash, zsh and PowerShell, each asked what Tab offers. Windows
  # runs the shells Windows users have: PowerShell 7 and the Windows PowerShell 5.1 it ships.
  completion:
    name: Shell completion (${{ matrix.os }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.completion == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # One debug build per OS, shared by the jobs that compile it: separate copies outgrow the 10 GB.
          shared-key: debug
      # conda-forge's zsh is built without zsh/zpty, which driving its completion needs.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Completion in real shells
        run: pixi run completion-e2e

  build:
    name: Build ${{ matrix.binary }} (${{ matrix.os }})
    needs: changes
    # The release profile (LTO, one codegen unit) on main only (#91): a pull request's tests already compile and
    # run on all three, and the release workflow builds every platform again before anything ships.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One job per extension, from cargo metadata (the changes job); each builds only its own binary.
        binary: ${{ fromJSON(needs.changes.outputs.binaries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89). One cache
      # per binary, so the matrix jobs do not overwrite each other's.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.binary }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Release build
        run: pixi run cargo build --release --bin ${{ matrix.binary }}
      - name: Smoke test
        run: pixi run cargo run --release --bin ${{ matrix.binary }} -- --version

  docs:
    name: Docs
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true
      - name: Build the site strictly
        run: pixi run -e docs docs-build

  # Dogfood the GitHub Action: generate this repository's own SBOMs with the released binary.
  sbom:
    name: SBOM via action (${{ matrix.target }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.action == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
      id-token: write # attestations
      attestations: write
    strategy:
      fail-fast: false
      # All five release platforms, not the three `-latest` labels the other jobs use, because
      # what this job exercises is the action's own `RUNNER_OS-RUNNER_ARCH` mapping to a release
      # archive (actions/pixi-sbom/action.yml). Two of those five branches used to never run, so a wrong platform
      # string or archive extension in them would have been found by a user rather than here
      # (#225). The job downloads a prebuilt binary rather than compiling, so five legs cost
      # well under a minute each.
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-15-intel, target: osx-64 }
          - { os: macos-latest, target: osx-arm64 }
          - { os: windows-latest, target: win-64 }
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOMs for every environment
        id: sbom
        uses: ./actions/pixi-sbom
        with:
          all-environments: "true"
          fetch-licenses: "true"
          pypi-mapping: prefix
          embedded-sboms: "true"
          # Vulnerabilities from OSV with CISA KEV flags, uploaded as SARIF from the linux-64 leg
          # only (one category per commit is enough, and there are two Linux runners now); the
          # gate reports rather than fails, since this lockfile's dev dependencies are not what
          # the tool ships.
          vulnerabilities: osv
          kev: "true"
          fail-on-severity: critical
          fail-on-kev: "true"
          fail-on-vulnerabilities: "false"
          upload-sarif: ${{ matrix.target == 'linux-64' && 'true' || 'false' }}
          sarif-category: pixi-sbom-${{ matrix.target }}
          # Attest the documents on main (pull requests have no id-token), from linux-64 only.
          attest: ${{ github.event_name == 'push' && matrix.target == 'linux-64' && 'true' || 'false' }}
          # Python-2.0 (pre-commit's python) is in every environment on every platform, so the
          # deny list trips everywhere and, with fail-on-policy off, becomes a warning.
          # require-license holds since 0.5.1 normalizes conda-forge's "WITH exceptions".
          deny-license: "Python-2.0"
          require-license: "true"
          fail-on-policy: "false"
          artifact-name: sboms-${{ matrix.target }}
      - name: Check the documents and the policy outcome
        shell: bash
        run: |
          ls -l sboms/
          test -s sboms/sbom-default.cdx.json
          test "${{ steps.sbom.outputs.policy-violated }}" = "true"
          echo "vulnerability gate tripped: ${{ steps.sbom.outputs.vulnerabilities-found }}"
          echo "pixi-sbom ${{ steps.sbom.outputs.version }} wrote to ${{ steps.sbom.outputs.output }}"
          # Every document carries the lookup's outcome even when it found nothing.
          test -s sboms/sbom-default.cdx.json
      - name: Verify the attestation
        if: ${{ github.event_name == 'push' && matrix.target == 'linux-64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "attested: ${{ steps.sbom.outputs.attestation-url }}"
          gh attestation verify sboms/sbom-default.cdx.json --repo "$GITHUB_REPOSITORY"
      - name: A satisfied policy exits 0
        uses: ./actions/pixi-sbom
        with:
          environment: default
          platform: linux-64
          output: sboms-policy
          deny-license: "AGPL-3.0-only"
          require-license: "true"
          upload-artifact: "false"

  # The action on a uv project and a venv, on a runner with no pixi: what a uv user's workflow
  # looks like. Until a release reads uv.lock, the action cannot download a binary that does,
  # so this builds the head binary here and puts it where the action keeps an install it has
  # already made (the reuse path it takes when it runs twice in one job), under a version no
  # release has. Everything after the download is the action exactly as a user runs it.
  action-head-binary:
    name: Build the binary for the action tests
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.action == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
          activate-environment: true
      # Compiled dependencies, restored from what main saved; a pull request never writes its own (#89).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # One debug build per OS, shared by the jobs that compile it: separate copies outgrow the 10 GB.
          shared-key: debug
      # A debug build: what the action is tested with here is its handling of a binary, not the binary's speed.
      - run: pixi run cargo build
      - uses: actions/upload-artifact@v4
        with:
          name: action-head-binary
          path: target/debug/pixi-sbom

  action-uv:
    name: Action on a uv project, without pixi
    needs: [changes, action-head-binary]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.action == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No pixi on this runner
        run: "! command -v pixi"
      - name: Install the head binary where the action reuses an install
        uses: actions/download-artifact@v4
        with:
          name: action-head-binary
          path: ${{ runner.temp }}/pixi-sbom-install/pixi-sbom-v0.0.0-head-linux-64/bin
      - run: chmod +x "$RUNNER_TEMP/pixi-sbom-install/pixi-sbom-v0.0.0-head-linux-64/bin/pixi-sbom"

      - name: SBOM of a uv.lock
        id: uv
        uses: ./actions/pixi-sbom
        with:
          version: 0.0.0-head
          lockfile: examples/projects/uv/01-django/uv.lock
          platform: linux-64
          output: sbom-uv
          upload-artifact: "false"
      - name: The document describes the uv project
        env:
          DOCUMENT: ${{ steps.uv.outputs.document }}
        run: |
          set -euo pipefail
          test "$DOCUMENT" = sbom-uv/sbom.cdx.json
          jq -e '.metadata.properties[] | select(.name == "pixi:lockfile") | .value == "uv.lock"' "$DOCUMENT"
          jq -e '[.components[] | select(.name == "django")] | length == 1' "$DOCUMENT"
          jq -e '.components | length >= 20' "$DOCUMENT"

      - name: A venv built in this job
        run: |
          python3 -m venv venv
          venv/bin/pip install --quiet requests==2.32.3
      - name: SBOM of the venv
        id: venv
        uses: ./actions/pixi-sbom
        with:
          version: 0.0.0-head
          prefix: venv
          output: sbom-venv
          upload-artifact: "false"
      - name: The document describes the venv
        env:
          DOCUMENT: ${{ steps.venv.outputs.document }}
        run: |
          set -euo pipefail
          jq -e '.metadata.properties[] | select(.name == "pixi:prefix") | .value == "venv"' "$DOCUMENT"
          jq -e '[.components[] | select(.name == "requests" and .version == "2.32.3")] | length == 1' "$DOCUMENT"
          # pip marks what was asked for by name (REQUESTED), and the root depends on that, not on
          # urllib3 and the rest that came along. ensurepip may mark pip itself as well.
          jq -e '[.dependencies[] | select(.ref == "root") | .dependsOn[]] | index("pkg:pypi/requests@2.32.3") != null' "$DOCUMENT"
          jq -e '[.dependencies[] | select(.ref == "root") | .dependsOn[]] | all(startswith("pkg:pypi/urllib3@") | not)' "$DOCUMENT"

      - name: Two sources at once are refused
        id: both
        continue-on-error: true
        uses: ./actions/pixi-sbom
        with:
          version: 0.0.0-head
          lockfile: examples/projects/uv/01-django/uv.lock
          prefix: venv
          upload-artifact: "false"
      - name: It failed, as it should
        if: steps.both.outcome != 'failure'
        run: |
          echo "::error::lockfile and prefix together should have failed"
          exit 1

  # The one check a pull request has to pass: every job that ran passed, and a job a filter skipped
  # counts as passed. A required status check points here, so a skipped job never leaves one pending.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, lint, test, coverage, deny, msrv, bench, scripts, completion, build, docs, sbom, action-head-binary, action-uv]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job ended $result"; exit 1 ;;
            esac
          done
