name: Publish the shared crate

# The shared crate, aesir-pixi-ext-contrib-common, published to crates.io from its release tag (#57). It gets no GitHub
# release, archives or wheels: it is not something anyone installs, only what the extensions build against, and an
# extension's release checks that the version it depends on is here before it tags (scripts/shared_crates.py).
#
# crates.io trusted publishing cannot create a crate, only publish new versions of one that exists, so the crate's
# first version has to be published by an owner with an API token; the `first` job says how when that is the case.

on:
  push:
    tags: ["aesir-pixi-ext-contrib-common-v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. aesir-pixi-ext-contrib-common-v0.1.0)"
        required: true
        type: string

concurrency:
  group: publish-common-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  first:
    name: Is the crate on crates.io yet
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Look the crate up
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: aesir-oss/pixi-ext-contrib release (https://github.com/aesir-oss/pixi-ext-contrib)' \
            https://crates.io/api/v1/crates/aesir-pixi-ext-contrib-common)
          if [ "$code" = 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            {
              echo "### The shared crate's first version is published by hand"
              echo
              echo "crates.io trusted publishing cannot create a crate. From a clean checkout of \`${TAG}\`, an owner runs"
              echo "\`pixi run cargo publish -p aesir-pixi-ext-contrib-common --locked\` with their API token, then on"
              echo "crates.io adds trusted publishers for the crate: repository \`aesir-oss/pixi-ext-contrib\`, workflows"
              echo "\`publish-common.yml\` (a release) and \`publish-crate.yml\` (a dispatch), as pixi-sbom has. Every later"
              echo "version publishes from here."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::aesir-pixi-ext-contrib-common is not on crates.io yet: its first version is published by hand (see the summary)"
            exit 1
          fi

  crate:
    needs: first
    if: needs.first.outputs.exists == 'true'
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing, granted to the called job
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
