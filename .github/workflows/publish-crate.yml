name: Publish crate

# Publishes the crate for a release tag to crates.io from a clean checkout of that tag, so
# `cargo install pixi-sbom` builds it and `cargo binstall pixi-sbom` reads its binstall
# metadata. Called by release-artifacts.yml; dispatch it by hand to (re)publish a tag.
#
# crates.io trusted publishing: the job exchanges its GitHub OIDC token for a short-lived
# crates.io token, so no long-lived API token is stored. The crate's settings on crates.io list
# this repository with both workflows that can reach this job, release-artifacts.yml (a release)
# and publish-crate.yml (a dispatch). A crate's first version cannot use it: publish that once by
# hand with a personal token, then add the trusted publisher.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.0)"
        required: true
        type: string

jobs:
  crate:
    name: crates.io ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io trusts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A clean checkout of the tag: cargo refuses to publish a dirty tree.
          git status --porcelain
          # The crate is the tag's name before its version: pixi-sbom-v1.2.0, aesir-pixi-ext-contrib-common-v0.1.0.
          crate="${TAG%-v[0-9]*}"
          echo "publishing ${crate} from ${TAG}"
          pixi run cargo publish -p "$crate" --locked
