[package]
name = "pixi-ext-common"
version = "0.1.0"
edition = "2024"
# pixi-sbom's: the extensions build on this crate, so it can claim no newer toolchain than they do.
rust-version = "1.88"
description = "Internal code shared by the pixi extensions in aesir-oss/pixi-ext-contrib; not an API"
license = "Apache-2.0"
repository = "https://github.com/aesir-oss/pixi-ext-contrib"
readme = "README.md"
# Compiled into each extension from this repository, never released on its own (#106).
publish = false

[dependencies]
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "string"] }
comfy-table = { version = "8", default-features = false, features = ["tty"] }
packageurl = "0.7.0"
rattler_conda_types = { version = "0.53", default-features = false }
rattler_lock = { version = "0.33.0", default-features = false }
spdx = "0.13.5"
tracing = "0.1.44"
