[package]
name = "pixi-sbom"
version = "1.13.0"
edition = "2024"
# Proved rather than asserted: `pixi run -e msrv msrv-check` builds on exactly this toolchain,
# and CI runs it. Raised from 1.85, which had never been true — let-chains, which this crate
# uses in kev.rs and osv.rs, did not stabilize until 1.88.
rust-version = "1.88"
description = "Generate a CycloneDX or SPDX SBOM from a pixi.lock file"
license = "Apache-2.0"
repository = "https://github.com/aesir-oss/pixi-ext-contrib"
homepage = "https://aesir-oss.github.io/pixi-ext-contrib/"
documentation = "https://aesir-oss.github.io/pixi-ext-contrib/"
readme = "README.md"
keywords = ["pixi", "sbom", "cyclonedx", "spdx", "conda"]
categories = ["command-line-utilities", "development-tools"]
# The crate is the binary and what it needs to build; the fixtures and the pre-commit mirror
# templates stay out of the crates.io package.
exclude = ["pre-commit-mirror/", "tests/"]

# What counts toward this crate's CHANGELOG.md beyond its own directory and the workspace crates it
# depends on (scripts/changelog.py). docs/ and examples/ are pixi-sbom's until the site gets a
# section per extension (#6). Releases up to v1.11.0 were made before the move into crates/, so that
# history is kept whole rather than filtered by path.
[package.metadata.changelog]
include = ["actions/pixi-sbom/**", "docs/**", "examples/**"]
history-before = "v1.11.0"

# `cargo binstall pixi-sbom` fetches the release archive for the host instead of compiling.
# The archives are named after pixi platforms, so each supported target is spelled out.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/pixi-sbom-v{ version }/pixi-sbom-v{ version }-linux-64.tar.gz"
bin-dir = "pixi-sbom-v{ version }-linux-64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/pixi-sbom-v{ version }/pixi-sbom-v{ version }-linux-aarch64.tar.gz"
bin-dir = "pixi-sbom-v{ version }-linux-aarch64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/pixi-sbom-v{ version }/pixi-sbom-v{ version }-osx-64.tar.gz"
bin-dir = "pixi-sbom-v{ version }-osx-64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/pixi-sbom-v{ version }/pixi-sbom-v{ version }-osx-arm64.tar.gz"
bin-dir = "pixi-sbom-v{ version }-osx-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/pixi-sbom-v{ version }/pixi-sbom-v{ version }-win-64.zip"
bin-dir = "pixi-sbom-v{ version }-win-64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

# The library is the binary's insides, exposed so the benchmarks and tests can reach them; it
# is not a designed API and makes no stability promise.
[lib]
name = "pixi_sbom"
path = "src/lib.rs"

[[bin]]
name = "pixi-sbom"
path = "src/main.rs"

[dependencies]
# The code the extensions share (#56), under a short name: `use common::license`.
common = { package = "aesir-pixi-ext-contrib-common", path = "../aesir-pixi-ext-contrib-common", version = "0.1.0" }
anstream = "1.0.0"
anstyle = "1.0.14"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
comfy-table = { version = "8", default-features = false, features = ["tty"] }
flate2 = "1.1.10"
indicatif = "0.18.6"
miette = { version = "7.6.0", features = ["fancy"] }
mimalloc = "0.1.52"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
packageurl = "0.7.0"
rattler_conda_types = { version = "0.53", default-features = false }
rattler_lock = { version = "0.33.0", default-features = false }
rayon = "1.12.0"
# --verify-files hashes installed files against conda-meta. Already in the tree through rattler.
sha2 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
spdx = "0.13.5"
tar = "0.4.46"
thiserror = "2.0.20"
toml = "1.1.6"
# Environment markers in pylock.toml and the other Python lockfiles. Already in the tree through
# rattler_lock; a direct dependency only so the readers can evaluate markers the way uv and pip do.
pep508_rs = { version = "0.9.2", default-features = false }
# conda-lock.yml. The parser rattler_lock already reads every pixi.lock with; a direct dependency only
# so the conda-lock reader can use it. Upstream is archived: follow rattler if it moves to a fork.
serde_yaml = "0.9.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.4.2", default-features = false, features = [
  "rustls",
  "gzip",
  "platform-verifier",
  "socks-proxy",
] }
uuid = { version = "1.26.1", features = ["v5"] }
zstd = "0.14.0"
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }

# A proxy set only in the Windows settings, with no environment variable, is invisible without
# this; it costs nothing on the other platforms because it is not built there.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["win-system-proxy"] }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.48.0", features = ["json", "redactions"] }
jsonschema = { version = "0.56.0", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["write", "std"] }
predicates = "3.1.4"
tempfile = "3.27.0"

# Criterion drives its own harness, so the built-in one is turned off for both targets.
[[bench]]
name = "documents"
harness = false

[[bench]]
name = "enrichment"
harness = false
