[package]
name = "pixi-sbom"
version = "1.13.2"
edition = "2024"
# Proved rather than asserted: `pixi run -e msrv msrv-check` builds on exactly this toolchain,
# and CI runs it. Raised from 1.85, which had never been true — let-chains, which this crate
# uses in kev.rs and osv.rs, did not stabilize until 1.88. Raised to 1.89 for serde-saphyr (#21).
rust-version = "1.89"
description = "Generate a CycloneDX or SPDX SBOM from a pixi.lock file"
license = "Apache-2.0"
repository = "https://github.com/aesir-oss/pixi-sbom"
homepage = "https://aesir-oss.github.io/pixi-sbom/"
documentation = "https://aesir-oss.github.io/pixi-sbom/latest/"
readme = "README.md"
keywords = ["pixi", "sbom", "cyclonedx", "spdx", "conda"]
categories = ["command-line-utilities", "development-tools"]
# Not on crates.io: conda-forge, PyPI and the release archives all build from this repository. Versions up to 1.13.0
# stay on crates.io as they were.
publish = false

# The library is the binary's insides, exposed so the benchmarks and tests can reach them; it
# is not a designed API and makes no stability promise.
[lib]
name = "pixi_sbom"
path = "src/lib.rs"

[[bin]]
name = "pixi-sbom"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
comfy-table = { version = "8", default-features = false, features = ["tty"] }
flate2 = "1.1.10"
indicatif = "0.18.6"
miette = { version = "7.6.0", features = ["fancy"] }
mimalloc = "0.1.52"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
packageurl = "0.7.0"
rattler_conda_types = { version = "0.53", default-features = false }
rattler_lock = { version = "0.33.0", default-features = false }
rayon = "1.12.0"
# --verify-files hashes installed files against conda-meta. Already in the tree through rattler.
sha2 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
spdx = "0.13.5"
tar = "0.4.46"
thiserror = "2.0.20"
toml = "1.1.6"
# Environment markers in pylock.toml and the other Python lockfiles. Already in the tree through
# rattler_lock; a direct dependency only so the readers can evaluate markers the way uv and pip do.
pep508_rs = { version = "0.9.2", default-features = false }
# conda-lock.yml, environment.yml, pnpm-lock.yaml, pnpm-workspace.yaml and yarn berry's yarn.lock. Pure
# Rust, unlike serde_yaml and its unmaintained unsafe-libyaml (#21), and the YAML crate rattler's
# conda-lock reader already uses.
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.4.2", default-features = false, features = [
  "rustls",
  "gzip",
  "platform-verifier",
  "socks-proxy",
] }
uuid = { version = "1.26.1", features = ["v5"] }
zstd = "0.14.0"
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }

# A proxy set only in the Windows settings, with no environment variable, is invisible without
# this; it costs nothing on the other platforms because it is not built there.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["win-system-proxy"] }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.48.0", features = ["json", "redactions"] }
jsonschema = { version = "0.56.0", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["write", "std"] }
predicates = "3.1.4"
tempfile = "3.27.0"

# Criterion drives its own harness, so the built-in one is turned off for both targets.
[[bench]]
name = "documents"
harness = false

[[bench]]
name = "enrichment"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
