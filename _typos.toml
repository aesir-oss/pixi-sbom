[files]
extend-exclude = [
  # Generated by git-cliff on release (scripts/changelog.py); commit hashes look like words to a spell checker.
  "crates/*/CHANGELOG.md",
  "crates/pixi-sbom/tests/fixtures/**",
  "crates/pixi-sbom/tests/schemas/**",
  "**/snapshots/**",
  "Cargo.lock",
  "pixi.lock",
  "*.cdx.json",
  "*.spdx.json",
  # Measured data: third-party repository and package names, not prose.
  "crates/pixi-sbom/docs/papers/data/**",
  # Recorded answers of OSV, PyPI and the CISA catalog for the training lab: third-party text, kept as published.
  "examples/lab-cache/**",
  # Lockfiles written by uv, pip, Poetry, PDM and conda-lock: package names and hashes, not prose.
  "examples/projects/**",
  # Generated from CRAN's and conda-forge's package lists: package names, not prose.
  "crates/pixi-sbom/data/cran.toml",
]

[default.extend-words]
# PyPI package name used in tests
certifi = "certifi"
# Crate name (deflate implementation)
flate = "flate"
# The macOS wheel repair tool (delocate-wheel), which copies a wheel's libraries into .dylibs/
delocate = "delocate"
