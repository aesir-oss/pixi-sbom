# The workspace site, served at the root of aesir-oss.github.io/pixi-ext-contrib/ and never versioned: the landing
# page, the repository-wide pages, and the files every extension site reads (extensions.json, the favicon). Each
# extension has its own versioned site beside its crate, crates/<extension>/mkdocs.yml, served under /<extension>/
# (#6).
INHERIT: mkdocs.base.yml
site_name: pixi-ext-contrib
site_description: Extensions for the pixi package manager, from Aesir Open Source Solutions
site_url: https://aesir-oss.github.io/pixi-ext-contrib/
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  overrides/
# The landing page links to the extension sites by relative path (pixi-sbom/, pixi-policy/), which are served beside
# this site but are not part of its build; MkDocs cannot see them, so it notes those links instead of failing.
validation:
  unrecognized_links: info

nav:
  - Extensions: index.md
  - pixi-sbom: https://aesir-oss.github.io/pixi-ext-contrib/pixi-sbom/latest/
  - pixi-policy: https://aesir-oss.github.io/pixi-ext-contrib/pixi-policy/latest/
  - Development: development.md
  - Security policy: security.md
  - Changelogs: changelog.md

hooks:
  - mkdocs_hooks.py

theme:
  custom_dir: docs/overrides
  favicon: assets/favicon.svg

plugins:
  - search

extra:
  repo_pages:
    SECURITY.md: security.md
    CHANGELOG.md: changelog.md
    extensions.json: extensions.json

extra_javascript:
  - javascripts/landing.js
