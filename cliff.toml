[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented here. The format follows\n[Conventional Commits](https://www.conventionalcommits.org) and this file is generated by\n[git-cliff](https://git-cliff.org) from the release workflow.\n"
body = """
{%- if version %}
## {{ version | trim_start_matches(pat="pixi-sbom-") | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{%- set message = commit.message | upper_first %}
{%- if version and version is starting_with("v") %}
{%- set message = message | replace(from="(#", to="(millsks/pixi-sbom#") %}
{%- endif %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/aesir-oss/pixi-ext-contrib/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
# Releases up to 1.11.0 (tagged vX.Y.Z) were made in millsks/pixi-sbom, so their (#N) references link there; the
# template marks them, and everything from 1.12.0 (tagged pixi-sbom-vX.Y.Z) links to this repository. GitHub
# redirects an /issues/N link to the pull request when N is one.
postprocessors = [
  { pattern = '\(millsks/pixi-sbom#([0-9]+)\)', replace = "([millsks/pixi-sbom#${1}](https://github.com/millsks/pixi-sbom/issues/${1}))" },
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/aesir-oss/pixi-ext-contrib/issues/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^(pixi-sbom-)?v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(ci|build)", group = "<!-- 6 -->CI and Build" },
  { message = "^chore", skip = true },
]
